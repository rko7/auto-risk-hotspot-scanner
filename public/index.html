<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auto Risk Hotspot Scanner</title>
</head>
<body>
  <h1>Auto Risk Hotspot Scanner</h1>

  <form id="searchForm">
    <label>From:
      <input type="date" id="dateFrom" required>
    </label>

    <label>To:
      <input type="date" id="dateTo" required>
    </label>

    <label>Division:
      <select id="division" required>
        <option value="">-- select --</option>
        <option value="51">51: Downtown</option>
        <option value="52">52: East York</option>
        <option value="53">53: North York</option>
        <option value="54">54: Scarborough</option>
        <option value="55">55: Etobicoke</option>
      </select>
    </label>

    <label>Limit:
      <input type="number" id="limit" value="25" min="1" max="100">
    </label>

    <button type="submit">Search</button>
  </form>

  <div id="results"></div>

  <script src="app.js"></script>
</body>
</html>
